<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#34d399" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#10b981" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Deep Dark Midnight Background -->
  <rect width="48" height="48" rx="10" fill="#040a16"/>

  <g filter="url(#neon-glow)">
    <!-- Outer Neon Ring -->
    <circle cx="24" cy="24" r="20" stroke="#34d399" stroke-width="2.2" fill="#062e24" fill-opacity="0.3"/>
    <circle cx="24" cy="24" r="20" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.85" fill="none"/>

    <!-- Central Stand -->
    <circle cx="24" cy="11.5" r="2.2" stroke="#34d399" stroke-width="1.8" fill="none"/>
    <circle cx="24" cy="11.5" r="2.2" stroke="#ffffff" stroke-width="0.7" fill="none"/>

    <line x1="24" y1="13.7" x2="24" y2="37" stroke="#34d399" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="24" y1="13.7" x2="24" y2="37" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round"/>

    <path d="M17 40.5 L20.5 36.5 H27.5 L31 40.5 Z" stroke="#34d399" stroke-width="2" fill="none" stroke-linejoin="round"/>
    <path d="M17 40.5 L20.5 36.5 H27.5 L31 40.5 Z" stroke="#ffffff" stroke-width="0.7" fill="none" stroke-linejoin="round"/>

    <!-- Beam -->
    <line x1="10" y1="18" x2="38" y2="18" stroke="#6ee7b7" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="10" y1="18" x2="38" y2="18" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round"/>
    <circle cx="24" cy="18" r="1.4" fill="#ffffff"/>

    <!-- Left Pan -->
    <polygon points="10,18 5.5,27 14.5,27" stroke="#34d399" stroke-width="1.8" fill="#10b981" fill-opacity="0.22" stroke-linejoin="round"/>
    <path d="M5.5 27 C5.5 32 14.5 32 14.5 27" stroke="#34d399" stroke-width="1.8" fill="#10b981" fill-opacity="0.22" stroke-linejoin="round"/>
    <path d="M5.5 27 C5.5 31.5 14.5 31.5 14.5 27" stroke="#ffffff" stroke-width="0.7" fill="none" stroke-linecap="round"/>

    <!-- Right Pan -->
    <polygon points="38,18 33.5,27 42.5,27" stroke="#34d399" stroke-width="1.8" fill="#10b981" fill-opacity="0.22" stroke-linejoin="round"/>
    <path d="M33.5 27 C33.5 32 42.5 32 42.5 27" stroke="#34d399" stroke-width="1.8" fill="#10b981" fill-opacity="0.22" stroke-linejoin="round"/>
    <path d="M33.5 27 C33.5 31.5 42.5 31.5 42.5 27" stroke="#ffffff" stroke-width="0.7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
