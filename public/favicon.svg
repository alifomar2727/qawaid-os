<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07132a"/>
      <stop offset="50%" stop-color="#06222b"/>
      <stop offset="100%" stop-color="#043329"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#e0be7a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#10b981" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#bg)" stroke="#10b981" stroke-width="1.8" stroke-opacity="0.85"/>
  <rect x="3.5" y="3.5" width="41" height="41" rx="10.5" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.8"/>

  <!-- Brand Scale Icon centered (24x24 scaled by 1.333 with origin offset) -->
  <g transform="translate(8, 8) scale(1.333)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Base -->
    <path d="M7 21h10" stroke="url(#gold)" stroke-width="2.2"/>
    <!-- Central Pole -->
    <path d="M12 3v18" stroke="url(#gold)" stroke-width="2.2"/>
    <!-- Top Beam -->
    <path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2" stroke="url(#gold)" stroke-width="2.2" fill="none"/>
    <!-- Left Pan -->
    <path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z" stroke="url(#emerald)" stroke-width="1.8" fill="rgba(16, 185, 129, 0.35)"/>
    <!-- Right Pan -->
    <path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z" stroke="url(#emerald)" stroke-width="1.8" fill="rgba(16, 185, 129, 0.35)"/>
    <!-- Top Jewel Dot -->
    <circle cx="12" cy="3" r="1.3" fill="#fde047"/>
  </g>
</svg>
