<html lang="ms">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

      rel="stylesheet"
    />

      document.documentElement.setAttribute('data-theme', 'dark');
      try { localStorage.removeItem('qawaid_theme'); } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
