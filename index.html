<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Isytihar laman ini sudah bertema gelap supaya pelayar (cth. Samsung Internet) tidak memaksa Dark Mode -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#060a18" />
    <meta name="darkreader-lock" />
    
    <!-- Meta Asas & Tajuk -->
    <title>Qawaid OS — Sistem Ulang Kaji Qawaid Fiqhiyyah</title>
    <meta name="description" content="Sistem Ulang Kaji Qawaid Fiqhiyyah" />

    <!-- Open Graph / OG Meta Tags (WhatsApp, Telegram, Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://qawaid-os.vercel.app/" />
    <meta property="og:site_name" content="Qawaid OS" />
    <meta property="og:title" content="Qawaid OS" />
    <meta property="og:description" content="Sistem Ulang Kaji Qawaid Fiqhiyyah" />
    <meta property="og:image" content="https://qawaid-os.vercel.app/og-image.png" />
    <meta property="og:image:secure_url" content="https://qawaid-os.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Qawaid OS — Sistem Ulang Kaji Qawaid Fiqhiyyah" />

    <!-- Fallback link & Itemprop untuk WhatsApp & Google -->
    <link rel="image_src" href="https://qawaid-os.vercel.app/og-image.png" />
    <meta itemprop="name" content="Qawaid OS" />
    <meta itemprop="description" content="Sistem Ulang Kaji Qawaid Fiqhiyyah" />
    <meta itemprop="image" content="https://qawaid-os.vercel.app/og-image.png" />

    <!-- Twitter / X Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://qawaid-os.vercel.app/" />
    <meta name="twitter:title" content="Qawaid OS" />
    <meta name="twitter:description" content="Sistem Ulang Kaji Qawaid Fiqhiyyah" />
    <meta name="twitter:image" content="https://qawaid-os.vercel.app/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@600;700&family=Scheherazade+New:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      document.documentElement.setAttribute('data-theme', 'dark');
      try { localStorage.removeItem('qawaid_theme'); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
